# Build this repository and publish the result as @shiplightai/devtools-assets.
#
# Why the build runs here: the CLI needs DevTools as built, servable files.
# Upstream's own npm package ships TypeScript source, so there is nothing to
# consume directly. Building in the job means no repository ever commits the
# ~120 MB of output — it exists only for the life of this run.
#
# Publishing uses npm trusted publishing: the job exchanges its GitHub Actions
# OIDC id-token for a short-lived registry token. That needs BOTH
# `id-token: write` below AND a trusted publisher configured on npm for
# ShiplightAI/devtools-frontend + this workflow filename. Trusted publishers are
# scoped to a repository, so moving this workflow here from the old monorepo
# invalidates the previous configuration — re-point it before the first publish.
#
# Version policy — deliberately unlike the CLI and MCP release workflows, which
# auto-bump the live npm patch version. These assets stay pinned across many
# shiplightai releases so npm's content-addressed cache can reuse the unchanged
# tarball. This publishes whatever version shiplight/devtools-assets/package.json
# already carries; bump it by hand, in a PR, when you publish a new build.
name: Publish devtools-assets

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run every gate but skip the npm publish (tests the workflow itself)'
        type: boolean
        default: false
      max_size_increase_pct:
        description: 'Maximum approved growth vs the live version; a genuinely newer DevTools snapshot may need this raised'
        type: string
        default: '5'

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write # npm trusted publishing: OIDC id-token -> short-lived registry token

    steps:
      # Two levels down, and both levels matter.
      #
      # The inner directory must be named devtools-frontend: it is the gclient
      # solution name, and .gclient sits beside it in the outer one.
      #
      # The outer directory must NOT be. scripts/devtools_paths.py decides
      # whether this is a standalone checkout or one embedded in Chromium by
      # reading the name of the checkout's PARENT directory, and treats
      # `devtools-frontend` as the embedded case — where the real root is two
      # levels up. GitHub's workspace is /home/runner/work/<repo>/<repo>, so for
      # this repository every path at or directly under it has a parent named
      # devtools-frontend. That sends third_party_path() to
      # /home/runner/work/third_party, and every ts_library.py action dies with
      # `ModuleNotFoundError: No module named 'node'`.
      #
      # Any name that is not devtools-frontend, devtools-frontend-internal or
      # renderer restores the standalone branch. It cannot be reproduced in a
      # checkout whose parent happens to be named anything else, which is to say
      # in any normal local clone.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: gclient/devtools-frontend

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # npm's OIDC token exchange landed in 11.5.1, and Node 22 bundles 10.9.x —
      # a CLI that has no idea OIDC exists, looks for a registry token this job
      # deliberately does not have, and dies with ENEEDAUTH. Node 24 bundles
      # 11.19.x, so the version below normally does nothing; it only upgrades if
      # the floating `node-version: '24'` ever resolves to an older image.
      #
      # This npm serves the pack and publish steps alone. The build runs the
      # vendored node in third_party/node, so it is unaffected either way.
      #
      # Matches monots' publish workflows, which publish the CLI, the SDK, the
      # MCP server and the 1.0.0 of this very package the same way.
      - name: Ensure npm supports trusted publishing (>= 11.5.1)
        run: |
          set -euo pipefail
          CURRENT=$(npm --version)
          echo "npm $CURRENT on node $(node --version)"
          if ! node -e "
            const [have, need] = [process.argv[1], '11.5.1'].map((v) => v.split('.').map(Number));
            const ok = have[0] > need[0]
              || (have[0] === need[0] && (have[1] > need[1] || (have[1] === need[1] && have[2] >= need[2])));
            process.exit(ok ? 0 : 1);
          " "$CURRENT"; then
            echo "npm $CURRENT predates trusted publishing — upgrading"
            npm install -g npm@latest
            npm --version
          fi

      # Catches the commonest misconfiguration — a job without `id-token: write`
      # — before spending an hour on a Chromium build.
      - name: Assert the OIDC id-token is available to this job
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            printf '::%s::%s\n' error "No OIDC id-token in this job — trusted publishing needs 'permissions: id-token: write'"
            exit 1
          fi
          echo "OIDC id-token endpoint present."

      - name: Install depot_tools
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git "$RUNNER_TEMP/depot_tools"
          echo "$RUNNER_TEMP/depot_tools" >> "$GITHUB_PATH"

      # The cxx_debugging extension's LLVM, lldb-eval and cmake dependencies are
      # gated on checkout_cxx_debugging_extension_deps and are by far the largest
      # things gclient would fetch. The debugger does not use that extension.
      - name: Sync dependencies
        working-directory: gclient
        run: |
          cat > .gclient <<'GCLIENT'
          solutions = [
            {
              "name": "devtools-frontend",
              "url": "https://github.com/ShiplightAI/devtools-frontend.git",
              "managed": False,
              "custom_deps": {},
              "custom_vars": {
                "checkout_cxx_debugging_extension_deps": False,
              },
            },
          ]
          GCLIENT
          gclient sync --no-history

      # docs/get_the_code.md: `gclient sync` then `npm run build`. The build
      # creates and initialises out/Default itself (package.json's prebuild runs
      # `gn gen`), so there is no separate gn step. Bundling and type-checking
      # stay on — the bundled output is what gets served.
      - name: Build
        working-directory: gclient/devtools-frontend
        run: npm run build

      - name: Stage the build output as the package's dist/
        working-directory: gclient/devtools-frontend
        run: |
          test -d out/Default/gen/front_end || {
            printf '::%s::%s\n' error "Build produced no out/Default/gen/front_end"
            exit 1
          }
          rm -rf shiplight/devtools-assets/dist
          cp -r out/Default/gen/front_end shiplight/devtools-assets/dist
          # gen/front_end is a build directory, not a distribution. Roughly two
          # thirds of it is byproduct the browser never requests: sourcemaps and
          # the .d.ts and .prebundle.js/.ts intermediates the bundler consumed,
          # plus fixtures/ — timeline and application test traces, 159 MB of
          # .json.gz on their own. Shipping the lot makes a 378 MB package where
          # the hand-built 1.0.0 was 120 MB, and trips the size gate below.
          #
          # Deleting them reproduces what 1.0.0 actually contained: 4,109 files,
          # none of them a map, a .ts or a fixture. The .js keep their
          # sourceMappingURL comments, as 1.0.0's did — the maps 404 only for
          # someone debugging DevTools itself in DevTools.
          find shiplight/devtools-assets/dist -name '*.map' -delete
          find shiplight/devtools-assets/dist -name '*.ts' -delete
          find shiplight/devtools-assets/dist -name '*.test.js' -delete
          find shiplight/devtools-assets/dist -name '*.prebundle.js' -delete
          rm -rf shiplight/devtools-assets/dist/panels/*/fixtures
          # The CLI resolves this package and joins "dist", then serves
          # inspector.html from it. A layout change surfaces in the CLI as a
          # misleading "package is not installed" error, so assert it here.
          test -f shiplight/devtools-assets/dist/inspector.html || {
            printf '::%s::%s\n' error "dist/inspector.html missing — the CLI serves this file; check the build output layout"
            exit 1
          }
          echo "staged $(find shiplight/devtools-assets/dist -type f | wc -l) files"

      - name: Assert the package declares no dependencies
        working-directory: gclient/devtools-frontend/shiplight/devtools-assets
        run: |
          node -e '
            const p = require("./package.json");
            for (const field of ["dependencies", "peerDependencies", "optionalDependencies"]) {
              if (p[field] && Object.keys(p[field]).length) {
                console.error(`::error::package.json declares ${field}; this package must stay dependency-free`);
                process.exit(1);
              }
            }
            console.log("no dependencies declared.");
          '

      # Unpacked against unpacked: npm reports dist.unpackedSize for the live
      # version, and comparing that to a packed tarball would compare
      # compressed bytes with uncompressed ones and report nonsense.
      - name: Compare size against the live version
        working-directory: gclient/devtools-frontend
        run: |
          NEW=$(du -sb shiplight/devtools-assets/dist | cut -f1)
          LIVE=$(npm view @shiplightai/devtools-assets dist.unpackedSize 2>/dev/null || echo 0)
          if [ "$LIVE" = "0" ] || [ -z "$LIVE" ]; then
            echo "No live version to compare against; skipping the size gate. new=${NEW} bytes"
            exit 0
          fi
          PCT=$(node -e "console.log(Math.round((($NEW - $LIVE) / $LIVE) * 100))")
          echo "unpacked live=${LIVE} new=${NEW} delta=${PCT}%"
          if [ "$PCT" -gt "${{ inputs.max_size_increase_pct }}" ]; then
            printf '::%s::%s\n' error "Unpacked size grew ${PCT}% (limit ${{ inputs.max_size_increase_pct }}%). Raise max_size_increase_pct if a newer DevTools snapshot explains it."
            exit 1
          fi

      - name: Pack
        working-directory: gclient/devtools-frontend/shiplight/devtools-assets
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL=$(ls "$RUNNER_TEMP"/shiplightai-devtools-assets-*.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          echo "Packed $(du -h "$TARBALL" | cut -f1)"

      # Runs on every dispatch, a real publish included: --dry-run performs npm's
      # OIDC token exchange, so a trusted publisher that names the wrong
      # repository or workflow file fails HERE, before anything is uploaded,
      # rather than as a bare ENEEDAUTH from the step below.
      #
      # Verbose because that is the only level at which npm says anything: on
      # success the log carries `oidc Successfully retrieved and set token`, and
      # on failure it names why the exchange was rejected. Quieter levels
      # swallow both.
      - name: npm publish --dry-run (exercises the OIDC token exchange)
        run: npm publish "$TARBALL" --access public --dry-run --loglevel verbose

      # `npm publish <tarball>` rather than `pnpm publish`: pnpm 10 has no OIDC
      # support at all. That is safe here because the package declares no
      # dependencies — asserted above — so there is no workspace: protocol for
      # npm to mishandle, and it uploads bytes that were already packed.
      #
      # No --provenance flag: under trusted publishing npm attaches provenance
      # by itself whenever the OIDC claim reports the repository as public, and
      # passing the flag explicitly would only turn a future return to private
      # into a failed publish.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish "$TARBALL" --access public
